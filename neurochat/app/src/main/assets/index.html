// Padrões e sequências
const PAT_E = ["🔴", "🔵", "🟢", "🟡", "🟣", "⭐", "🔺", "🔷"];
function mkPattern(mode, hard) {
    if (mode === "num") {
        const d = 2 + grnd(hard ? 7 : 4);
        const a0 = 1 + grnd(9);
        const kind = hard ? grnd(3) : 0;
        let seq = [];
        if (kind === 0)
            seq = Array.from({ length: 5 }).map((_, i) => a0 + d * i);
        else if (kind === 1)
            seq = Array.from({ length: 5 }).map((_, i) => a0 * Math.pow(2, i));
        else
            seq = Array.from({ length: 5 }).map((_, i) => (i + 1) * (i + 1));
        const ans = seq[4];
        const shown = seq.slice(0, 4);
        const s = new Set([ans]);
        while (s.size < 3)
            s.add(ans + grnd(9) - 4 || ans + 5);
        const o = gshuf([...s]);
        return { shown: shown.map(String), opts: o.map(String), a: o.indexOf(ans) };
    }
    const es = gshuf(PAT_E).slice(0, 3);
    const units = hard ? [[0, 1, 2], [0, 0, 1, 2], [0, 1, 1, 2]] : [[0, 1], [0, 0, 1], [0, 1, 2]];
    const u = units[grnd(units.length)];
    const total = u.length * 2 + 1;
    const full = Array.from({ length: total }).map((_, i) => es[u[i % u.length]]);
    const ans = full[total - 1];
    const o = gshuf(es.concat([PAT_E.find((x) => !es.includes(x))])).slice(0, 4);
    if (!o.includes(ans))
        o[0] = ans;
    const oo = gshuf(o);
    return { shown: full.slice(0, total - 1), opts: oo, a: oo.indexOf(ans) };
}

// Sons da natureza com temporizador
function GSounds({ cfg, done }) {
    const [kind, setKind] = useState("rain");
    const [mins, setMins] = useState(3);
    const [left, setLeft] = useState(0);
    const [msg, setMsg] = useState("");
    const ctx = useRef(null);
    const stopAudio = () => { try {
        if (ctx.current) {
            ctx.current.close();
            ctx.current = null;
        }
    }
    catch (e) { } };
    useEffect(() => stopAudio, []);
    useEffect(() => {
        if (left <= 0)
            return;
        const id = setTimeout(() => {
            if (left <= 1) {
                stopAudio();
                setLeft(0);
                done("Sessão de sons terminada. Que sua mente descanse 🌿");
            }
            else
                setLeft(left - 1);
        }, 1000);
        return () => clearTimeout(id);
    }, [left]);
    const start = () => {
        stopAudio();
        setMsg("");
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC)
                throw new Error("sem áudio");
            const c = new AC();
            ctx.current = c;
            const len = c.sampleRate * 2;
            const buf = c.createBuffer(1, len, c.sampleRate);
            const dt = buf.getChannelData(0);
            let last = 0;
            for (let i = 0; i < len; i++) {
                const w = Math.random() * 2 - 1;
                last = kind === "rain" ? w : (last + 0.02 * w) / 1.02;
                dt[i] = kind === "rain" ? w * 0.5 : last * 3.5;
            }
            const src = c.createBufferSource();
            src.buffer = buf;
            src.loop = true;
            const f = c.createBiquadFilter();
            f.type = kind === "rain" ? "highpass" : kind === "waves" ? "lowpass" : "bandpass";
            f.frequency.value = kind === "rain" ? 1200 : kind === "waves" ? 500 : 450;
            const g = c.createGain();
            g.gain.value = kind === "rain" ? 0.07 : 0.2;
            if (kind !== "rain") {
                const lfo = c.createOscillator();
                const lg = c.createGain();
                lfo.frequency.value = kind === "waves" ? 0.12 : 0.2;
                lg.gain.value = kind === "waves" ? 0.12 : 0.08;
                lfo.connect(lg);
                lg.connect(g.gain);
                lfo.start();
            }
            src.connect(f);
            f.connect(g);
            g.connect(c.destination);
            src.start();
        }
        catch (e) {
            setMsg("Este aparelho não conseguiu tocar o som. O temporizador funciona mesmo assim.");
        }
        setLeft(mins * 60);

function scoreTest(id, ans) {
  const t = TESTS[id]; let sw = 0, sm = 0, cw = 0, cm = 0;
  const dom = t.domains.map(() => ({ w: 0, m: 0 }));
  const rev = []; let nonRevSum = 0, nonRevN = 0;
  t.items.forEach((it, i) => {
    const raw = ans[i] == null ? 0 : ans[i];
    if (it[2] === "c") { cw += 4; cm += raw; return; }

    sw += w * 4; sm += w * v;
    if (dom[it[1]]) { dom[it[1]].w += w * 4; dom[it[1]].m += w * v; }
    if (it[2] === "r") rev.push(v); else { nonRevSum += raw; nonRevN++; }
  });

  const pct = Math.round((0.8 * sym + 0.2 * ctx) * 100);
  const avg = nonRevN ? nonRevSum / nonRevN : 0;
  const incons = rev.length === 2 && rev.every((v) => Math.abs(v - avg) >= 2.5);
  const band = pct >= 75 ? 3 : pct >= 55 ? 2 : pct >= 35 ? 1 : 0;
  return { pct, band, incons, domains: t.domains.map((n, i) => ({ name: n, pct: dom[i].w ? Math.round(dom[i].m / dom[i].w * 100) : 0 })) };
}
